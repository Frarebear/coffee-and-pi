name: CoffeeAndPi
options:
  bundleIdPrefix: com.caleb
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CoffeeAndPi:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # XcodeGen objectVersion 77 drops `resources:` for .xcassets; list under sources instead.
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Coffee & Pi
        PRODUCT_BUNDLE_IDENTIFIER: com.caleb.CoffeeAndPi
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Coffee & Pi
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Coffee & Pi finds and serves your other devices on the local network."
        INFOPLIST_KEY_NSBonjourServices: ["_coffeeandpi._tcp."]
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Coffee & Pi uses the mic for composer dictation."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Coffee & Pi turns speech into composer text."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: CoffeeAndPi.entitlements
      properties:
        com.apple.security.device.audio-input: true
